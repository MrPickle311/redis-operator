user default off
user _operator on >op-secret ~* &* +@all
user _replication on >repl-secret +psync +replconf +ping
masteruser _replication
masterauth repl-secret
maxmemory 100663296
maxmemory-policy noeviction
databases 16
io-threads 1
appendonly yes
unixsocket /controller/redis.sock
unixsocketperm 700
port 0
tls-port 6379
tls-replication yes
tls-auth-clients yes
tls-cert-file /tls/tls.crt
tls-key-file /tls/tls.key
tls-client-cert-file /tls/replication.crt
tls-client-key-file /tls/replication.key
tls-ca-cert-file /tls/trusted.crt
cluster-enabled yes
cluster-config-file /data/nodes.conf
cluster-port 16379
cluster-announce-hostname store-1-0.store-1-hl.app.svc
cluster-preferred-endpoint-type hostname
cluster-allow-replica-migration no
tls-cluster yes
