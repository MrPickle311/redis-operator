user default off
user _operator on >op-secret ~* &* +@all
user _replication off >repl-secret +psync +replconf +ping
masteruser _replication
masterauth repl-secret
maxmemory 100663296
maxmemory-policy noeviction
databases 16
io-threads 1
appendonly yes
unixsocket /controller/redis.sock
unixsocketperm 700
