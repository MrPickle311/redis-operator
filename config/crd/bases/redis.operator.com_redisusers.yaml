---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: redisusers.redis.operator.com
spec:
  group: redis.operator.com
  names:
    kind: RedisUser
    listKind: RedisUserList
    plural: redisusers
    singular: redisuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.username
      name: Username
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: RedisUser is a user of Redis for one application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of RedisUser
            properties:
              acl:
                description: ACL is what the user may do.
                properties:
                  rules:
                    description: |-
                      Rules are ACL rules of Redis, one per item, e.g. "~orders:*", "+@read",
                      "-@dangerous". The password and whether the user is on come from the
                      operator, so rules may not set them.
                    items:
                      description: 'ACLRule is one ACL rule of Redis: one word, and
                        no password.'
                      maxLength: 256
                      pattern: ^[^\s<>#!][^\s]*$
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-validations:
                    - message: nopass, resetpass, reset, on and off are set by the
                        operator
                      rule: self.all(r, !(r.lowerAscii() in ['nopass', 'resetpass',
                        'reset', 'on', 'off']))
                required:
                - rules
                type: object
              authentication:
                description: Authentication tells where the password comes from.
                properties:
                  generate:
                    description: |-
                      Generate makes the operator create the Secret <name>-redis-user, with
                      the keys username and password, for the application to mount.
                    type: boolean
                  passwordSecretRef:
                    description: PasswordSecretRef selects the password in a Secret
                      of the user.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: set exactly one of passwordSecretRef and generate
                  rule: has(self.passwordSecretRef) != (has(self.generate) && self.generate)
              targetRef:
                description: TargetRef names the database, in the same namespace,
                  the user belongs to.
                properties:
                  kind:
                    default: RedisInstance
                    description: Kind is the kind of the database; RedisCluster comes
                      with step 10.
                    enum:
                    - RedisInstance
                    type: string
                  name:
                    description: Name is the name of the database.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              username:
                description: |-
                  Username is the name the application logs in with. It defaults to the
                  name of the RedisUser.
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
                type: string
                x-kubernetes-validations:
                - message: default is the user spec.acl.defaultUser of the RedisInstance
                    controls
                  rule: self != 'default'
            required:
            - acl
            - authentication
            - targetRef
            type: object
          status:
            description: status defines the observed state of RedisUser
            properties:
              conditions:
                description: |-
                  Conditions: Ready is True once every running instance of the database
                  has the user as specified.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              username:
                description: Username is the name the user logs in with.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
