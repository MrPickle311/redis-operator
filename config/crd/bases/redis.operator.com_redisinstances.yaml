---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: redisinstances.redis.operator.com
spec:
  group: redis.operator.com
  names:
    kind: RedisInstance
    listKind: RedisInstanceList
    plural: redisinstances
    singular: redisinstance
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: RedisInstance is the Schema for the redisinstances API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of RedisInstance
            properties:
              image:
                type: string
              instances:
                default: 1
                format: int32
                minimum: 1
                type: integer
              storage:
                properties:
                  existingClaims:
                    description: |-
                      ExistingClaims binds instances to PVCs created outside of the operator.
                      The operator never deletes these PVCs.
                    items:
                      description: ExistingClaim binds one instance to an existing
                        PVC.
                      properties:
                        claimName:
                          minLength: 1
                          type: string
                        instanceOrdinal:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - claimName
                      - instanceOrdinal
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - instanceOrdinal
                    x-kubernetes-list-type: map
                  volumeClaimTemplate:
                    description: |-
                      VolumeClaimTemplate is used to generate a PVC for every instance
                      not listed in ExistingClaims. Generated PVCs are owned by the operator.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: storageClassName is immutable
                          rule: self == oldSelf
                    required:
                    - size
                    type: object
                type: object
            required:
            - image
            - storage
            type: object
            x-kubernetes-validations:
            - message: storage.existingClaims[].instanceOrdinal must be lower than
                instances
              rule: '!has(self.storage.existingClaims) || self.storage.existingClaims.all(c,
                c.instanceOrdinal < self.instances)'
            - message: storage.volumeClaimTemplate is required unless storage.existingClaims
                cover every instance
              rule: has(self.storage.volumeClaimTemplate) || (has(self.storage.existingClaims)
                && size(self.storage.existingClaims) >= self.instances)
          status:
            description: status defines the observed state of RedisInstance
            properties:
              currentPrimary:
                type: string
              phase:
                type: string
              readyInstances:
                format: int32
                type: integer
            type: object
        required:
