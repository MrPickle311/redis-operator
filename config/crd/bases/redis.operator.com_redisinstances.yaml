---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: redisinstances.redis.operator.com
spec:
  group: redis.operator.com
  names:
    kind: RedisInstance
    listKind: RedisInstanceList
    plural: redisinstances
    singular: redisinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.currentPrimary
      name: Primary
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: RedisInstance is the Schema for the redisinstances API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of RedisInstance
            properties:
              acl:
                default: {}
                description: ACL configures the users of Redis.
                properties:
                  defaultUser:
                    default: disabled
                    description: |-
                      DefaultUser enables the default user of Redis, which needs no password
                      and may run every command. Meant for development only.
                    enum:
                    - disabled
                    - enabled
                    type: string
                type: object
              affinity:
                default: {}
                description: Affinity places the instances on the nodes.
                properties:
                  podAntiAffinityType:
                    default: required
                    description: |-
                      PodAntiAffinityType keeps the instances on different nodes, so a node
                      that fails takes at most one of them. required leaves an instance
                      Pending without a free node; preferred places it anyway, e.g. on a
                      small cluster for development.
                    enum:
                    - required
                    - preferred
                    type: string
                type: object
              failover:
                default: {}
                description: Failover configures what happens when the primary is
                  not available.
                properties:
                  delay:
                    default: 30s
                    description: |-
                      Delay is how long the primary may be unavailable before a replica
                      takes over. A primary that cannot read its RedisInstance fences itself
                      after half of it, so it takes no more writes by then.
                    type: string
                    x-kubernetes-validations:
                    - message: delay must be at least 4s
                      rule: duration(self) >= duration('4s')
                  fenceOnAPILoss:
                    default: true
                    description: |-
                      FenceOnAPILoss makes a primary that cannot read its RedisInstance for
                      Delay/2 hold back writes, as a replica may be promoted meanwhile. With
                      false, writes go on while the API server is down, at the risk of two
                      primaries taking writes during a network partition.
                    type: boolean
                type: object
              image:
                type: string
              instances:
                default: 1
                format: int32
                minimum: 1
                type: integer
              redis:
                default: {}
                description: Redis configures redis-server.
                properties:
                  maxmemoryPolicy:
                    default: noeviction
                    description: |-
                      MaxmemoryPolicy is what Redis does when it reaches maxmemory. The
                      default noeviction rejects writes instead of silently deleting keys.
                    enum:
                    - noeviction
                    - allkeys-lru
                    - allkeys-lfu
                    - allkeys-random
                    - volatile-lru
                    - volatile-lfu
                    - volatile-random
                    - volatile-ttl
                    type: string
                  maxmemoryRatio:
                    default: 75
                    description: |-
                      MaxmemoryRatio is the percent of the memory limit that becomes
                      maxmemory. The rest is left for fork copy-on-write, replication and
                      client buffers, and fragmentation.
                    format: int32
                    maximum: 95
                    minimum: 10
                    type: integer
                  parameters:
                    additionalProperties:
                      description: |-
                        ParameterValue is the value of an option of redis.conf. It is one line, so
                        it can never add another option.
                      maxLength: 1024
                      pattern: ^[^\r\n]*$
                      type: string
                    description: |-
                      Parameters are further options of redis.conf, set on every instance
                      with CONFIG SET, without a restart, e.g. {"hz": "20"}.
                    maxProperties: 64
                    type: object
                    x-kubernetes-validations:
                    - message: parameter names are lowercase options of redis.conf
                      rule: self.all(k, k.matches('^[a-z][a-z0-9-]{0,63}$'))
                    - message: 'parameters must not set options the operator manages:
                        ports, files, replication, users, memory, persistence, TLS,
                        cluster and commands that run code; databases and io-threads
                        go to spec.redis.startup'
                      rule: '!self.exists(k, k.matches(''^(bind|port|unixsocket.*|protected-mode|dir|dbfilename|append(only|dirname|filename)|save|(replica|slave)of|master(user|auth)|replica-(announce-.*|read-only)|slave-read-only|user|aclfile|requirepass|maxmemory|maxmemory-policy|databases|io-threads.*|include|rename-command|loadmodule|daemonize|supervised|pidfile|logfile|enable-.*-(command|configs)|tls-.*|cluster-.*)$''))'
                  persistence:
                    default: aof
                    description: Persistence is how the dataset survives a restart
                      of Redis.
                    enum:
                    - aof
                    - rdb
                    - none
                    type: string
                  startup:
                    default: {}
                    description: |-
                      Startup holds the options redis-server reads only when it starts.
                      Changing any of them replaces every Pod, one at a time: a rolling
                      update, with a switchover for the primary.
                    properties:
                      databases:
                        default: 16
                        description: Databases is the number of logical databases,
                          selected with SELECT.
                        format: int32
                        minimum: 1
                        type: integer
                      ioThreads:
                        default: 1
                        description: |-
                          IOThreads is the number of threads that serve clients; 1 is the main
                          thread alone.
                        format: int32
                        maximum: 128
                        minimum: 1
                        type: integer
                    type: object
                type: object
              resources:
                description: |-
                  Resources of the redis container. Set limits.memory: maxmemory is
                  derived from it, see redis.maxmemoryRatio.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              storage:
                description: |-
                  StorageSpec chooses the volumes when the RedisInstance is created. After
                  that the operator alone manages them through status.volumes, so the volume
                  of a running instance can never be switched by an edit of the spec.
                properties:
                  existingClaims:
                    description: |-
                      ExistingClaims binds instances to PVCs created outside of the operator.
                      The operator never deletes these PVCs. An ordinal at or above instances
                      reserves the PVC for scaling up.
                    items:
                      description: ExistingClaim binds one instance to an existing
                        PVC.
                      properties:
                        claimName:
                          minLength: 1
                          type: string
                        instanceOrdinal:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - claimName
                      - instanceOrdinal
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - instanceOrdinal
                    x-kubernetes-list-type: map
                  recreateOnNodeLoss:
                    description: |-
                      RecreateOnNodeLoss moves a replica whose generated volume is local to a
                      node that is gone, or tainted node.kubernetes.io/out-of-service, to a
                      new generated volume, where it syncs from the primary. Without it such a
                      replica waits for its node. External volumes and the primary are never
                      moved: a failover takes over from a primary on a lost node first.
                    type: boolean
                  volumeClaimTemplate:
                    description: |-
                      VolumeClaimTemplate is used to generate a PVC for every instance
                      not listed in ExistingClaims. Generated PVCs are owned by the operator.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        type: string
                        x-kubernetes-validations:
                        - message: storageClassName is immutable
                          rule: self == oldSelf
                    required:
                    - size
                    type: object
                type: object
                x-kubernetes-validations:
                - message: storage.existingClaims is immutable; use the redis.operator.com/recreate
                    annotation to move a replica to a new volume
                  rule: has(self.existingClaims) == has(oldSelf.existingClaims) &&
                    (!has(self.existingClaims) || self.existingClaims == oldSelf.existingClaims)
            required:
            - image
            - storage
            type: object
            x-kubernetes-validations:
            - message: storage.volumeClaimTemplate is required unless storage.existingClaims
                cover every instance
              rule: has(self.storage.volumeClaimTemplate) || (has(self.storage.existingClaims)
                && self.storage.existingClaims.filter(c, c.instanceOrdinal < self.instances).size()
                == self.instances)
          status:
            description: status defines the observed state of RedisInstance
            properties:
              conditions:
                description: Conditions of the instance, e.g. MemoryLimited.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentPrimary:
                type: string
              handledRequests:
                additionalProperties:
                  type: string
                description: |-
                  HandledRequests holds, per request annotation, the value the operator
                  last handled, so a request kept in the annotation is not served again.
                type: object
              phase:
                type: string
              primaryEpoch:
                description: |-
                  PrimaryEpoch grows with every change of the primary. The Instance
                  Managers reject commands sent for an older epoch, e.g. by a former
                  operator leader.
                format: int64
                type: integer
              readyInstances:
                format: int32
                type: integer
              targetPrimary:
                description: TargetPrimary is the Pod a switchover in progress moves
                  the primary to.
                type: string
              volumes:
                description: |-
                  Volumes binds every instance to its PVC. A binding is made once, when
                  the instance first gets a volume, and stays until the instance is
                  removed or recreated, so it is the memory of the operator: the spec
                  only provides the initial choice.
                items:
                  description: VolumeStatus is the volume bound to one instance.
                  properties:
                    claimName:
                      description: ClaimName is the PVC of the instance.
                      type: string
                    external:
                      description: |-
                        External is true for a PVC from spec.storage.existingClaims, which the
                        operator never deletes.
                      type: boolean
                    message:
                      description: Message explains a State other than Ready.
                      type: string
                    ordinal:
                      format: int32
                      type: integer
                    state:
                      description: VolumeState is the observed state of the volume
                        of one instance.
                      enum:
                      - Ready
                      - Terminating
                      - Missing
                      - Lost
                      - Detached
                      type: string
                    uid:
                      description: |-
                        UID of the PVC when it was bound. A PVC with the same name and another
                        UID was deleted and created again: it holds other data.
                      type: string
                  required:
                  - claimName
                  - ordinal
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - ordinal
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
