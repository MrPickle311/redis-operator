resources:
- manager.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: controller
  newName: registry.homelab/library/redis-operator
  newTag: latest
replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=manager].image
    kind: Deployment
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=OPERATOR_IMAGE].value
    select:
      kind: Deployment
