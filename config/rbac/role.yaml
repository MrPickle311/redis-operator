---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - redis.operator.com
  resources:
  - redisinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - redis.operator.com
  resources:
  - redisinstances/finalizers
  verbs:
  - update
- apiGroups:
  - redis.operator.com
  resources:
  - redisinstances/status
  verbs:
  - get
  - patch
  - update
