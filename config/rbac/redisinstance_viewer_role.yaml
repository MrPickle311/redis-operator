# This rule is not used by the project redis-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to redis.operator.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: redis-operator
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-view: "true"    # redisinstance_viewer_role.yaml
  name: redisinstance-viewer-role
rules:
- apiGroups:
  - redis.operator.com
  resources:
  - redisinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - redis.operator.com
  resources:
  - redisinstances/status
  verbs:
  - get
