---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-redis-operator-com-v1-redisuser
  failurePolicy: Ignore
  name: vredisuser.redis.operator.com
  rules:
  - apiGroups:
    - redis.operator.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - redisusers
  sideEffects: None
  timeoutSeconds: 5
