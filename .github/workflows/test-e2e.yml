name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.33.0

jobs:
  # Every shard has a Kind cluster of its own, so the shards run side by side.
  # The long specs stop the operator or drain nodes (Serial), which a cluster
  # can do only one at a time: that is why they are split between clusters
  # and not just between Ginkgo processes. Within a shard, the specs that can
  # share the cluster run on `procs` processes.
  #
  # `rest` takes whatever no other shard names, so a new Describe is never
  # left out: add its name to a shard only to balance the run times.
  test-e2e:
    permissions:
      contents: read
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RedisCluster
            focus: ^RedisCluster\b
            skip: ^RedisCluster changing shards
            procs: 2
          - name: RedisCluster changing shards
            focus: ^RedisCluster changing shards
            procs: 1
          - name: Nodes and volumes
            focus: ^(Nodes|Node loss|RedisInstance volumes)\b
            procs: 1
          - name: Failover
            focus: ^(Self-fencing of the Instance Manager|Automatic failover|Network partition)\b
            procs: 1
          - name: rest
            skip: ^(RedisCluster|Nodes|Node loss|RedisInstance volumes|Self-fencing of the Instance Manager|Automatic failover|Network partition)\b
            procs: 3
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -sSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Running Test e2e
        env:
          E2E_FOCUS: ${{ matrix.focus }}
          E2E_SKIP: ${{ matrix.skip }}
          E2E_PROCS: ${{ matrix.procs }}
        run: make test-e2e-parallel

      - name: Export the logs of the cluster
        if: failure()
        run: kind export logs --name redis-operator-test-e2e ./kind-logs

      - name: Upload the logs of the cluster
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-${{ strategy.job-index }}
          path: kind-logs
          retention-days: 7
